[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-insights"
version = "1.0.0"
description = "Scrape e-commerce product, price and review data, clean it with an ETL pipeline, and analyse it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "selenium>=4.15",
    "pandas>=2.1",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
